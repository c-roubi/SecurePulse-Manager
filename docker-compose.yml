version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: c2_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-c2_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - c2_network

  # C2 Server (FastAPI)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: c2_server
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-c2_db}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key}
      DEBUG: ${DEBUG:-False}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - c2_network

  # React Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: c2_dashboard
    environment:
      VITE_API_URL: http://localhost:8000/api
      VITE_WS_URL: ws://localhost:8000/ws
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./dashboard:/app
    networks:
      - c2_network

  # Detection Module (Python)
  detection:
    build:
      context: ./detection
      dockerfile: Dockerfile
    container_name: c2_detection
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-c2_db}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./detection:/app
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - c2_network

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: c2_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - c2_network

volumes:
  postgres_data:
  redis_data:

networks:
  c2_network:
    driver: bridge
